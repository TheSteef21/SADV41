<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SADV41 GEAR 5 HAKI - Oficial Completo</title>
  
  <!-- Motor AR Facial -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>
  
  <!-- Motor AR Corporal (MediaPipe) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
  
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: transparent !important; font-family: monospace; }
    
    #sadv41-logo-ui { position: absolute; top: 20px; left: 20px; z-index: 10; color: #FFD700; font-weight: bold; text-shadow: 0 0 5px #FFD700; display: flex; flex-direction: column; font-size: 18px; }
    .trinity-badge { font-size: 0.7em; color: #00FFFF; text-shadow: 0 0 5px #00FFFF; margin-top: 2px; }
    #sadv41-overlay { position: absolute; top: 20px; right: 20px; z-index: 10; color: #00FFFF; font-weight: bold; text-shadow: 0 0 8px #00FFFF; letter-spacing: 1px; }
    
    .ui-container { position: absolute; bottom: 50px; width: 100%; display: flex; justify-content: center; z-index: 10; }
    .capture-btn { padding: 15px 40px; background: rgba(0, 255, 255, 0.1); border: 2px solid #00FFFF; color: #FFF; border-radius: 50px; font-weight: bold; font-size: 16px; cursor: pointer; backdrop-filter: blur(8px); transition: 0.3s; text-transform: uppercase; letter-spacing: 2px;}
    .a-enter-vr { display: none !important; }
    
    #input_video { display: none; }
  </style>
</head>
<body>

  <div id="sadv41-logo-ui">
    <span>SADV41</span>
    <span class="trinity-badge">1 | 4</span>
  </div>
  <div id="sadv41-overlay">VERIFIED 🎚</div>
  
  <div class="ui-container">
      <button class="capture-btn" id="activate-btn">DESPERTAR GEAR 5</button>
  </div>

  <video id="input_video" autoplay playsinline></video>

  <!-- Escena AR Híbrida -->
  <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-assets timeout="15000">
      <!-- Rutas absolutas para asegurar carga directa en GitHub Pages -->
      <img id="tex-logo" src="./models/sadv41_logo.png" crossorigin="anonymous">
      <img id="tex-humo" src="./models/humo_divino.png" crossorigin="anonymous">
      <img id="tex-brazo" src="./models/haki_brazos.png" crossorigin="anonymous">
    </a-assets>

    <a-camera active="false" position="0 0 0"></a-camera>

    <!-- CAPA 2: Ojos Haki de Observación (MindAR Face Tracking) -->
    <a-entity mindar-face-target="anchorIndex: 168">
       <a-sphere id="haki-ojo-izq" color="#00FFFF" radius="0.012" opacity="0" position="-0.032 0.01 0" material="emissive: #00FFFF; emissiveIntensity: 50"></a-sphere>
       <a-sphere id="haki-ojo-der" color="#00FFFF" radius="0.012" opacity="0" position="0.032 0.01 0" material="emissive: #00FFFF; emissiveIntensity: 50"></a-sphere>
    </a-entity>

    <!-- CAPAS 3, 4 y 5: Anclaje Visual Directo (Head/Body Rig central) -->
    <a-entity id="body-rig" position="0 0 -0.8">
      <!-- Logo Pecho (Ajustado al centro visible) -->
      <a-image id="haki-logo-pecho" src="#tex-logo" position="0 -0.2 0" scale="0.45 0.45 0.45" visible="false" material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>
      
      <!-- Humo Cuello (Ajustado sobre los hombros) -->
      <a-image id="haki-humo-cuello" src="#tex-humo" position="0 0.25 -0.05" scale="1.1 0.7 1" visible="false" material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>
      
      <!-- Brazos Haki (Izquierdo y Derecho fijos al torso para garantizar despliegue inmediato) -->
      <a-image id="haki-brazo-izq" src="#tex-brazo" position="-0.4 -0.1 0" scale="0.45 0.7 1" visible="false" material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>
      <a-image id="haki-brazo-der" src="#tex-brazo" position="0.4 -0.1 0" scale="0.45 0.7 1" visible="false" material="shader: flat; transparent: true; alphaTest: 0.05"></a-image>
    </a-entity>
  </a-scene>

  <script>
    const btn = document.getElementById('activate-btn');
    const ojoIzq = document.getElementById('haki-ojo-izq');
    const ojoDer = document.getElementById('haki-ojo-der');
    
    const logoPecho = document.getElementById('haki-logo-pecho');
    const humoCuello = document.getElementById('haki-humo-cuello');
    const brazoIzq = document.getElementById('haki-brazo-izq');
    const brazoDer = document.getElementById('haki-brazo-der');
    const videoElement = document.getElementById('input_video');
    
    let activado = false;
    let mediapipeIniciado = false;

    const holistic = new Holistic({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`;
    }});
    
    holistic.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      refineFaceLandmarks: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    holistic.onResults((results) => {
      if (!activado || !results.poseLandmarks) return;

      const hombroIzq = results.poseLandmarks[11];
      const hombroDer = results.poseLandmarks[12];
      const codoIzq = results.poseLandmarks[13];
      const codoDer = results.poseLandmarks[14];

      // Dinámica de seguimiento si MediaPipe detecta el cuerpo
      if (hombroIzq && hombroDer) {
        const pechoX = ((hombroIzq.x + hombroDer.x) / 2 - 0.5) * 1.5;
        const pechoY = -((hombroIzq.y + hombroDer.y) / 2 - 0.5) * 1.5;
        
        logoPecho.setAttribute('position', `${pechoX} ${pechoY - 0.15} 0`);
        humoCuello.setAttribute('position', `${pechoX} ${pechoY + 0.3} -0.05`);
      }

      if (hombroIzq && codoIzq) {
        const bX = (codoIzq.x - 0.5) * 1.5;
        const bY = -(codoIzq.y - 0.5) * 1.5;
        brazoIzq.setAttribute('position', `${bX} ${bY} 0`);
      }

      if (hombroDer && codoDer) {
        const bX = (codoDer.x - 0.5) * 1.5;
        const bY = -(codoDer.y - 0.5) * 1.5;
        brazoDer.setAttribute('position', `${bX} ${bY} 0`);
      }
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        if (activado) {
          await holistic.send({image: videoElement});
        }
      },
      width: 640,
      height: 480
    });

    btn.addEventListener('click', () => {
       if(!activado) {
           btn.innerText = "HAKI ACTIVADO";
           btn.style.background = "rgba(0, 255, 255, 0.4)";
           btn.style.boxShadow = "0 0 30px rgba(0, 255, 255, 0.8)";
           
           // Encender Ojos
           ojoIzq.setAttribute('opacity', '0.9');
           ojoDer.setAttribute('opacity', '0.9');
           
           // Forzar visibilidad inmediata de los assets PNG
           logoPecho.setAttribute('visible', 'true');
           humoCuello.setAttribute('visible', 'true');
           brazoIzq.setAttribute('visible', 'true');
           brazoDer.setAttribute('visible', 'true');
           
           activado = true;

           if(!mediapipeIniciado) {
               camera.start();
               mediapipeIniciado = true;
           }
       } else {
           btn.innerText = "DESPERTAR GEAR 5";
           btn.style.background = "rgba(0, 255, 255, 0.1)";
           btn.style.boxShadow = "none";
           
           ojoIzq.setAttribute('opacity', '0');
           ojoDer.setAttribute('opacity', '0');
           
           logoPecho.setAttribute('visible', 'false');
           humoCuello.setAttribute('visible', 'false');
           brazoIzq.setAttribute('visible', 'false');
           brazoDer.setAttribute('visible', 'false');
           
           activado = false;
       }
    });
  </script>
</body>
</html>
