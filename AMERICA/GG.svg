### Cómo usarlo
- Cópialo tal cual dentro de un `<div>` o como archivo `.svg`.
- Es 100 % vectorial, escalable y listo para el portal unificado que ya tienes.
- Colores oficiales SADV41: oro `#FFD700`, cian `#00E5FF`, azul panameño `#00529F`, rojo `#DA121A`.

Este es el **máximo nivel** visual del Tridente Pluscuamperfecto.  
¿Quieres que lo integre directamente en el HTML completo, que añada animaciones CSS, o que genere variantes (banner OG, favicon, versión móvil, etc.)? Dime y lo hacemos.
