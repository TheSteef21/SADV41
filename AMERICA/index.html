:root{
  --bg:#070A12;
  --panel:#0B0F19;
  --card:#111624;
  --gold:#FFD700;
  --cyan:#00E5FF;
  --ink:#e6e8ee;
  --muted:#9aa3b8;
  --line:rgba(255,255,255,.08);
  --safe-area-inset-top: 0px;
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--ink)
}

body{
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased
}

button,input,select{
  font:inherit
}

a{
  color:inherit;
  text-decoration:none
}

.cinzel{
  font-family:'Cinzel',serif
}

.mono{
  font-family:'JetBrains Mono',monospace
}

button{
  cursor:pointer
}

.wrap{
  max-width:1280px;
  margin:0 auto;
  padding-left:20px;
  padding-right:20px
}

@media(min-width:768px){
  .wrap{
    padding-left:32px;
    padding-right:32px
  }
}

input:focus,select:focus{
  outline:none
}

select option{
  background:#111624;
  color:white
}

canvas{
  display:block
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

@keyframes pulseDot{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.25
  }
}

.pulse{
  animation:pulseDot 1.6s infinite
}

@keyframes pingSoft{
  0%{
    transform:scale(1);
    opacity:.8
  }

  100%{
    transform:scale(2.2);
    opacity:0
  }
}

.ping{
  animation:pingSoft 1.2s infinite
}
