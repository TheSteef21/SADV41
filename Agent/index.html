<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 | Web3 Standalone Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { navy: '#0b0f19', card: '#111827', gold: '#d97706' }
                }
            }
        }
    </script>
</head>
<body class="bg-navy text-slate-100 min-h-screen font-mono p-4 sm:p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="border-b border-slate-800 pb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <div>
                <h1 class="text-2xl font-bold text-amber-500 tracking-wider">⚡ SADV41 | Web3 Console</h1>
                <p class="text-xs text-slate-400">stevendior.ai • Autónoma On-Chain via Direct RPC</p>
            </div>
            <span class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-3 py-1 rounded-full font-semibold">
                🟢 Direct Blockchain Mode
            </span>
        </header>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- Controles y Consultas -->
            <div class="bg-card p-4 rounded-xl border border-slate-800 space-y-4 shadow-lg">
                <h2 class="text-sm font-semibold text-amber-400 uppercase tracking-wider border-b border-slate-800 pb-2">
                    Consultar Billetera EVM
                </h2>
                
                <div class="space-y-2">
                    <label class="block text-xs text-slate-400">Wallet de Cobro / Dirección EVM</label>
                    <input type="text" id="targetAddress" 
                           value="0x8CE929Fc25D9aE5ce73fb5913a4211998555a6CB" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-emerald-400 font-mono focus:outline-none focus:border-amber-500">
                </div>

                <div class="grid grid-cols-1 gap-2 pt-2">
                    <button onclick="fetchNativeBalance()" class="w-full bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold py-2.5 px-3 rounded-lg text-xs flex justify-between items-center transition-all">
                        <span>📊 Consultar Balance Nativo (BNB)</span>
                        <span class="text-xs font-mono">BSC Mainnet</span>
                    </button>

                    <button onclick="validateEVM()" class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 py-2.5 px-3 rounded-lg text-xs font-medium flex justify-between items-center transition-all">
                        <span>🛡️ Validar Formato de Dirección</span>
                        <span class="text-amber-500">ethers.js</span>
                    </button>
                </div>

                <div class="pt-3 border-t border-slate-800">
                    <label class="block text-xs text-slate-400 mb-1">Redes RPC Activas</label>
                    <div class="flex items-center gap-2 text-xs text-slate-400">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <span>BNB Smart Chain (Chain ID: 56)</span>
                    </div>
                </div>
            </div>

            <!-- Terminal en Vivo -->
            <div class="bg-card p-4 rounded-xl border border-slate-800 shadow-lg flex flex-col h-80 md:h-auto">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-2">
                    <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Consola de Respuestas</h2>
                    <button onclick="clearTerminal()" class="text-xs text-slate-500 hover:text-slate-300">Limpiar</button>
                </div>
                <div id="logs" class="flex-1 bg-slate-950 rounded-lg p-3 text-xs font-mono overflow-y-auto space-y-2">
                    <p class="text-slate-500">[SADV41 System] Consola web autónoma lista. Realiza una consulta directa.</p>
                </div>
            </div>

        </div>

    </div>

    <script>
        const BSC_RPC = "https://bsc-dataseed.binance.org/";

        function log(msg, type = "info") {
            const el = document.getElementById('logs');
            const p = document.createElement('p');
            const time = new Date().toLocaleTimeString();

            if (type === "error") {
                p.className = "text-rose-400";
                p.innerText = `[${time}] ❌ ${msg}`;
            } else if (type === "success") {
                p.className = "text-emerald-400 font-semibold";
                p.innerText = `[${time}] ✅ ${msg}`;
            } else {
                p.className = "text-slate-300";
                p.innerText = `[${time}] ℹ️ ${msg}`;
            }

            el.appendChild(p);
            el.scrollTop = el.scrollHeight;
        }

        function clearTerminal() {
            document.getElementById('logs').innerHTML = '<p class="text-slate-500">[SADV41 System] Consola limpia.</p>';
        }

        function validateEVM() {
            const addr = document.getElementById('targetAddress').value.trim();
            if (window.ethers && ethers.utils.isAddress(addr)) {
                log(`Dirección EVM válida: ${addr}`, "success");
            } else {
                log(`Dirección EVM inválida: ${addr}`, "error");
            }
        }

        async function fetchNativeBalance() {
            const addr = document.getElementById('targetAddress').value.trim();
            if (!window.ethers || !ethers.utils.isAddress(addr)) {
                log("Ingresa una dirección EVM válida primero.", "error");
                return;
            }

            log(`Consultando balance on-chain en BNB Chain para ${addr}...`);
            try {
                const provider = new ethers.providers.JsonRpcProvider(BSC_RPC);
                const rawBalance = await provider.getBalance(addr);
                const bnbFormatted = ethers.utils.formatEther(rawBalance);
                log(`Balance Nativo: ${parseFloat(bnbFormatted).toFixed(6)} BNB`, "success");
            } catch (e) {
                log(`Error conectando al nodo RPC: ${e.message}`, "error");
            }
        }
    </script>
</body>
</html>
