<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADV41 | Web3 Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { navy: '#0b0f19', card: '#111827' } } }
        }
    </script>
</head>
<body class="bg-navy text-slate-100 min-h-screen font-mono p-4 sm:p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="border-b border-slate-800 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-amber-500">⚡ SADV41 | Standalone Web3</h1>
                <p class="text-xs text-slate-400">stevendior.ai • Direct RPC Connection</p>
            </div>
            <span class="text-xs bg-emerald-900/50 text-emerald-400 border border-emerald-700 px-3 py-1 rounded-full">Direct RPC</span>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-card p-4 rounded-xl border border-slate-800 space-y-4">
                <h2 class="text-sm font-semibold text-amber-400 uppercase">Consultar Billetera On-Chain</h2>
                <div class="space-y-2">
                    <label class="text-xs text-slate-400">Dirección EVM</label>
                    <input type="text" id="targetAddress" value="0x8CE929Fc25D9aE5ce73fb5913a4211998555a6CB" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-emerald-400 focus:outline-none">
                </div>
                <button onclick="fetchNativeBalance()" class="w-full bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold py-2 rounded-lg text-xs">
                    📊 Consultar BNB Balance Directo (RPC)
                </button>
            </div>

            <div class="bg-card p-4 rounded-xl border border-slate-800 flex flex-col h-64">
                <h2 class="text-sm font-semibold text-slate-300 border-b border-slate-800 pb-2 mb-2">Respuesta en Vivo</h2>
                <div id="logs" class="flex-1 bg-slate-950 rounded-lg p-3 text-xs text-emerald-400 font-mono overflow-y-auto">
                    <p class="text-slate-500">Consola autónoma lista.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BSC_RPC = "https://bsc-dataseed.binance.org/";

        function log(msg, err = false) {
            const el = document.getElementById('logs');
            const p = document.createElement('p');
            p.className = err ? 'text-rose-400' : 'text-emerald-400';
            p.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            el.appendChild(p);
            el.scrollTop = el.scrollHeight;
        }

        async function fetchNativeBalance() {
            const addr = document.getElementById('targetAddress').value.trim();
            if (!ethers.utils.isAddress(addr)) {
                log("Dirección EVM inválida", true);
                return;
            }

            log(`Consultando balance en BNB Chain para: ${addr}...`);
            try {
                const provider = new ethers.providers.JsonRpcProvider(BSC_RPC);
                const rawBalance = await provider.getBalance(addr);
                const bnb = ethers.utils.formatEther(rawBalance);
                log(`✅ Balance Nativo: ${parseFloat(bnb).toFixed(6)} BNB`);
            } catch (e) {
                log(`Error conectando al RPC: ${e.message}`, true);
            }
        }
    </script>
</body>
</html>
