e cine épico de presupuesto de estudio mayor. Genera UNA imagen fija con calidad de fotograma de película, no de ilustración ni de póster de videojuego.

TÍTULO: El Sábado del Testimonio: Reposo en la Piedra Angular
CONCEPTO: Día de reposo. Después de la tormenta, apóstol de armadura negra de pie, inmóvil y en paz, sobre gran Piedra Angular intacta, mientras alrededor se derrumban ruinas de reinos antiguos. Refugio, autoridad serena y restauración, no combate.
COMPOSICIÓN: Formato 16:9 anamórfico 2.39:1 con letterbox suave, regla de tercios. Personaje centrado ligeramente a la izquierda, plano medio americano (cintura hacia arriba), leve contrapicado ~8°. Mirada directa a cámara, serena y firme. Fénix blanco-dorado con aureola de luz posado sobre su cabello cano, alas semi-abiertas, en calma. Línea de horizonte baja. Tres planos: primer plano polvo y chispas desenfocadas, plano medio personaje y piedra, fondo ruinas, obeliscos y esfinges en colapso lento con bruma.
PERSONAJE: Cabello rizado largo blanco-plateado como humo vivo, sin volumen artificial. Ojos con resplandor cian suave. Armadura negra mate de placas (cuero y acero envejecido), hombreras con cruces blancas grabadas, pectoral con emblema S dorado-turquesa. Desgaste realista: rayones, polvo, micro-abolladuras, remaches. Manos relajadas, no puño ni arma. Una mano abierta hacia abajo en gesto de paz, luz cálida fina sale de la palma. Mantos de humo blanco girando lento alrededor de cuello y hombros como oración o incienso.
SIMBOLISMO: 1 Piedra Angular Ef 2:20: gran piedra de sillar tallado intacta bajo los pies, escudo SADV41 grabado en relieve dorado en cara frontal. 2 Costado Traspasado Jn 19:34: grieta en la roca de la que brota hilo de agua cristalina, se une a arroyo turquesa luminoso hacia el fondo. Sin sangre explícita, solo leve matiz rojo-vino. 3 Del Edén a la Nueva Jerusalén: izquierda tierra seca con espinos quemados y cielo rojo ceniza (Génesis 3). Derecha mismo suelo con brotes verdes, lirios blancos y luz dorada de ciudad en horizonte (Apocalipsis 21). Transición natural. 4 Ruinas que caen: obeliscos y columnas con grietas, fragmentos suspendidos en cámara lenta, sin tocar al personaje. 5 Refugio Salmo 46: halo de luz cálida detrás del personaje como escudo de luz. 6 Cruz: resplandor de luz blanca en forma de cruz en el cielo entre nubes, God rays, sin lasers ni rojo agresivo. 7 Sábado: sol bajo golden hour que anuncia cierre del día, calma extrema. Banderas opcional sutil: pequeñas esferas de luz tenue en borde del cielo, con Panamá en primer lugar, nunca dominantes.
CINEMATOGRAFÍA: Cámara ARRI Alexa 65 o equivalente large format. Lente anamórfica 40mm T2.8, bokeh oval, flares horizontales azul-turquesa suaves. Foco nítido en ojos y barba, fondo y primer plano con desenfoque cinematográfico. Grano 35mm fino, halación sutil. Movimiento implícito: partículas, humo y cenizas en suspensión, instante congelado en cámara lenta.
ILUMINACIÓN 3 puntos: Key sol bajo dorado desde derecha 3200K suave con contraluz rasante en cabello y humo. Fill rebote turquesa frío desde arroyo 6500K muy tenue solo en sombras. Kicker cian desde ojos y emblema, contorno sobre barba. Volumetría haces de luz en polvo y bruma. Contraste alto con detalle en negros.
COLOR: Paleta #0B1426, #D4A64A, #27C4D4, #F4F0E6. Acentos mínimos rojo-vino. Teal-and-orange controlado, saturación moderada, piel natural sin plástico, negros cálidos. Referencia Denis Villeneuve / Roger Deakins, sobriedad Terrence Malick.
TEXTO EN IMAGEN: Sobre la piedra: SADV41. Letterbox inferior: MÓDULO SAT · Salmo 46:1. No escribir nada más.
CALIDAD: 8K hiperrealismo cinematográfico, texturas piel con poros, metal micro-detalle, sin artefactos, manos 5 dedos correctos, anatomía natural.
