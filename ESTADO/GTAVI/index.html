<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTA VI · Conexión (fan page no oficial)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body{background:#050505;color:#eef2f8;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
    .connection-box{text-align:center;background:#11161f;border:1px solid #ff9900;padding:30px;border-radius:8px;box-shadow:0 0 30px rgba(255,153,0,.2);max-width:500px;width:90%}
    .asset-img{max-width:100%;height:auto;border-radius:4px;margin-bottom:20px;border:1px solid #242e42}
    h1{color:#ff9900;text-transform:uppercase;letter-spacing:3px;font-size:1.4rem;margin:0 0 12px;font-weight:700}
    .console-output{background:#000;color:#0f0;font-family:'JetBrains Mono',monospace;padding:15px;border-radius:4px;text-align:left;font-size:.85rem;margin-top:20px;border:1px solid #222}
    .blink{animation:b 1s step-end infinite}
    @keyframes b{50%{opacity:0}}
    small{display:block;margin-top:14px;color:#64748b;font-size:.7rem}
  </style>
</head>
<body>
  <div class="connection-box">
    <h1>GTA VI · Conexión</h1>
    <img class="asset-img" src="img/Meta_AI_856844343_1148864021034560_8204811431986995824_n_20261030_000639.webp" alt="Arte GTA VI (Meta AI)">
    <p>Iniciando protocolo de enlace con nodo remoto...</p>
    <div class="console-output">
      &gt; root@termux:~# init_connection -target "GTAVI"<br>
      &gt; Cargando asset visual... [OK]<br>
      &gt; Estableciendo túnel seguro... [OK]<br>
      &gt; Esperando respuesta del servidor<span class="blink">_</span>
    </div>
    <small>Página de fans, no afiliada a Rockstar Games.</small>
  </div>
</body>
</html>
