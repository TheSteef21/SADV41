  #biblia-bar b{color:#f59e0b}

<body>

 style="position:fixed;top:8px;left:8px;z-index:2147483647;background:#0a0a0acc;color:#00e5ff;
 border:1px solid #00e5ff;border-radius:20px;padding:4px 10px;font:600 11px/1.3 system-ui,sans-serif;
 text-decoration:none;letter-spacing:.04em">📖 Salmos 46 · Dios es nuestro amparo</a>

<div id="bar">
  <b>🎚 TSEC · PEDRO MIGUEL</b> (M≥2.5)
  <a href="../index.html">← TSEC</a> | <a href="../../../SISMOS/index.html">SISMOS</a><br>
  Mag: <select id="mag"><option selected>2.5</option><option>3.0</option><option>3.7</option><option>4.5</option></select>
  Días: <select id="dias"><option value="1">24 h</option><option value="7" selected>7 días</option><option value="30">30 días</option></select>
  <button id="act">Actualizar</button>

</div>

  🛡️ <b>¡Mantente a salvo!</b><br>

</div>

<div id="biblia-bar">
  📖 <b id="v-ref">Cargando Biblia...</b>: <span id="v-txt"></span>
</div>

<script>
(function(){
  var FAULT_URL = 'pedro-miguel-falla.geojson';
  var estado = document.getElementById('estado');
  var lastQuakes = new Set();

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function loadScript(src,ok,fail){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=fail;document.head.appendChild(s);}

  // Distancia (km) a la traza de la Falla Pedro Miguel
  function distKm(lat,lon,line){
    var k=Math.cos(lat*Math.PI/180),best=Infinity;
    function P(c){return [(c[0]-lon)*111.32*k,(c[1]-lat)*110.57];}
    for(var i=0;i<line.length-1;i++){
      var a=P(line[i]),b=P(line[i+1]),dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;
      var t=L?Math.max(0,Math.min(1,-(a[0]*dx+a[1]*dy)/L)):0;
      var x=a[0]+t*dx,y=a[1]+t*dy,d=Math.sqrt(x*x+y*y);
      if(d<best)best=d;
    }
    return best;
  }

  function color(m){return m>=5?'#ef4444':m>=4?'#fb923c':m>=3?'#facc15':'#38bdf8';}
  function hace(ms){
    var m=Math.round((Date.now()-ms)/60000);
    if(m<60)return 'hace '+m+' min';
    var h=Math.round(m/60);
    if(h<48)return 'hace '+h+' h';
    return 'hace '+Math.round(h/24)+' d';
  }

  // Notificaciones Web (Android / iOS / PC)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }

  document.getElementById('btnNotif').onclick = function() {
    if (!('Notification' in window)) {
      alert('Tu navegador o dispositivo no soporta notificaciones push nativas.');
      return;
    }
    Notification.requestPermission().then(perm => {
      if (perm === 'granted') {
        alert('✅ Notificaciones activadas en tu dispositivo');
        new Notification('🛡️ SADV41 Pedro Miguel Alertas', {
          body: 'Notificaciones activas para eventos sísmicos en Panamá (M≥2.5).'
        });
      } else {
        alert('⚠️ Permisos de notificación denegados.');
      }
    });
  };

  function notificarSismo(m, lugar) {
    if (window.Notification && Notification.permission === 'granted') {
      new Notification('🚨 ALERTA SÍSMICA PANAMÁ (M' + m + ')', {
        body: lugar + ' - Mantente a salvo con @Sismosyterremotos',
        icon: 'https://leafletjs.com/docs/images/logo.png'
      });
    }
  }

  // Versículos Bíblicos desde /BIBLIA/
  function cargarBiblia() {
    var bibliaPaths = ['../../../BIBLIA/rv1909.json', '/SADV41/BIBLIA/rv1909.json'];
    function intentar(idx) {
      if(idx >= bibliaPaths.length) {
        document.getElementById('v-ref').textContent = 'Salmos 46:1';
        document.getElementById('v-txt').textContent = 'Dios es refugio y ayuda en cualquier momento; no estás solo. (resumen propio)';
        return;
      }
      fetch(bibliaPaths[idx])
        .then(r => r.json())
        .then(data => {
          var libros = Object.keys(data);
          var lib = libros[Math.floor(Math.random() * libros.length)];
          var caps = Object.keys(data[lib]);
          var cap = caps[Math.floor(Math.random() * caps.length)];
          var vers = Object.keys(data[lib][cap]);
          var ver = vers[Math.floor(Math.random() * vers.length)];
          document.getElementById('v-ref').textContent = lib + ' ' + cap + ':' + ver;
          document.getElementById('v-txt').textContent = data[lib][cap][ver];
        })
        .catch(() => intentar(idx + 1));
    }
    intentar(0);
  }

  function init(){
    cargarBiblia();
    var map = L.map('map').setView([8.95, -79.6], 9);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var quakes = L.layerGroup().addTo(map), line = null;

    fetch(FAULT_URL).then(r => r.json()).then(g => {
      L.geoJSON(g, {
        style: f => f.geometry.type === 'LineString' ? {color:'#ef4444', weight:3, dashArray:'8 6'} : {},
        pointToLayer: (f,ll) => L.circleMarker(ll, {radius:4, color:'#94a3b8', weight:1, fillOpacity:.8}),
        onEachFeature: (f, layer) => {
          var p = f.properties || {}, h = '<b>' + esc(p.nombre) + '</b>';
          if(p.tipo) h += '<br>' + esc(p.tipo);
          if(p.ruptura_historica) h += '<br>' + esc(p.ruptura_historica);
          layer.bindPopup(h);
          if(f.geometry.type === 'LineString') line = f.geometry.coordinates;
        }
      }).addTo(map);
      cargar();
    }).catch(() => cargar());

    function cargar(){
      var mag = document.getElementById('mag').value;
      var dias = +document.getElementById('dias').value;
      var ini = new Date(Date.now() - dias * 864e5).toISOString().slice(0,19);

      var url = 'https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&orderby=time&limit=500' +
        '&minlatitude=5&maxlatitude=11&minlongitude=-84&maxlongitude=-76' +
        '&minmagnitude=' + encodeURIComponent(mag) + '&starttime=' + ini;

      estado.textContent = 'Consultando USGS…';
      fetch(url).then(r => r.json()).then(d => {
        quakes.clearLayers();
        var n = 0, cerca = 0;
        (d.features || []).forEach(f => {
          var c = f.geometry.coordinates, p = f.properties, m = p.mag;
          var dk = line ? distKm(c[1], c[0], line) : null;
          n++; if (dk !== null && dk <= 10) cerca++;

          if (!lastQuakes.has(f.id) && lastQuakes.size > 0 && (Date.now() - p.time) < 3600000) {
            notificarSismo(m, p.place);
          }
          lastQuakes.add(f.id);

          var h = '<b>M' + esc(m) + '</b> · ' + esc(p.place) + '<br>' + hace(p.time) + ' · prof. ' + esc(Math.round(c[2])) + ' km';
          if (dk !== null) h += '<br>≈ ' + dk.toFixed(1) + ' km de la falla Pedro Miguel';
          if (p.url) h += '<br><a target="_blank" rel="noopener" href="' + esc(p.url) + '">Detalle USGS</a>';

          L.circleMarker([c[1], c[0]], {
            radius: 3 + (m || 0) * 2,
            color: color(m),
            weight: 1,
            fillColor: color(m),
            fillOpacity: .55
          }).bindPopup(h).addTo(quakes);
        });
        estado.textContent = n + ' sismos (M≥' + mag + ')' + (line ? ' · ' + cerca + ' a ≤10 km de la falla' : '');
      }).catch(() => { estado.textContent = 'Reconectando con USGS...'; });
    }

    document.getElementById('act').onclick = cargar;
    document.getElementById('mag').onchange = cargar;
    document.getElementById('dias').onchange = cargar;
    setInterval(cargar, 180000);
  }

  loadScript('lib/leaflet.js', init, function(){
    loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js', init, function(){ estado.textContent='Error cargando Leaflet.'; });
  });
})();
</script>
