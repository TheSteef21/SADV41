<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>SADV41 // ENV</title>
  <style>
    :root { --bg: #07090e; --card: #0f141f; --cyan: #00f0ff; --gold: #ffd700; --text: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .box { background: var(--card); border: 1px solid rgba(0, 240, 255, 0.25); border-radius: 14px; padding: 28px; max-width: 680px; width: 100%; box-shadow: 0 0 30px rgba(0, 240, 255, 0.08); }
    .lock-title { color: var(--cyan); font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; text-align: center; }
    input { width: 100%; padding: 14px; background: #05070a; border: 1px solid #1e293b; border-radius: 8px; color: var(--gold); font-size: 1rem; text-align: center; margin-bottom: 14px; outline: none; }
    input:focus { border-color: var(--cyan); }
    button { width: 100%; padding: 14px; background: linear-gradient(90deg, #00c6ff, #0072ff); border: none; border-radius: 8px; color: #fff; font-weight: 700; letter-spacing: 1px; cursor: pointer; }
    .error { color: #ff4d4d; font-size: 0.85rem; text-align: center; margin-top: 10px; display: none; }
    #vault { display: none; line-height: 1.65; }
    .badge { display: inline-block; background: rgba(255, 215, 0, 0.12); color: var(--gold); border: 1px solid rgba(255, 215, 0, 0.3); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; margin-bottom: 10px; }
    h1 { color: var(--cyan); font-size: 1.5rem; margin-bottom: 4px; }
    h2 { color: var(--gold); font-size: 1.15rem; margin: 18px 0 10px; }
    .meta { color: #94a3b8; font-size: 0.85rem; margin-bottom: 16px; }
    hr { border: 0; border-top: 1px solid #1e293b; margin: 16px 0; }
    p { margin-bottom: 12px; font-size: 0.95rem; }
    ul { padding-left: 20px; margin-bottom: 16px; }
    li { margin-bottom: 10px; font-size: 0.93rem; }
    strong { color: var(--cyan); }
    .footer-note { text-align: right; font-size: 0.8rem; color: var(--gold); margin-top: 20px; }
  </style>
</head>
<body>
  <div class="box" id="gate">
    <div class="lock-title">SADV41 // ACCESO RESTRINGIDO</div>
    <input type="password" id="pass" placeholder="Escribe tu nombre o clave" onkeydown="if(event.key==='Enter') unlock()">
    <button onclick="unlock()">ABRIR ARCHIVO</button>
    <div class="error" id="err">Acceso denegado. Verifica tu clave.</div>
  </div>

  <div class="box" id="vault"></div>

      slots: [
        {"salt":"kz6aSETAXBNL5S8DOd5Q5w==","iv":"Hb36kPb0lvpWW6Wy","wrapped":"9X2t5x/RNePJ6blX0HTKyhddmHgQYLDG5u7vjyKG2ntT/CBtZaV9hcdl2b6XlrL5"},
        {"salt":"i7rUymJhjQPp85WMOn40tQ==","iv":"3arTMQQ3UWjTDukI","wrapped":"GHeplVeJ6E7SE7S77S3G+eAH9I/RPIuHD6upr884ZlWY4x10AcwdhMUpyp9GaCJj"}
      ]
    };

    const b64ToBuf = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

    async function tryUnwrap(slot, pass) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
      const derivedKey = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64ToBuf(slot.salt), iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      return await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64ToBuf(slot.iv) },
        derivedKey,
        b64ToBuf(slot.wrapped)
      );
    }

    async function unlock() {
      const rawPass = document.getElementById('pass').value.trim().toLowerCase();
      const err = document.getElementById('err');
      err.style.display = 'none';

      let rawMasterKey = null;
      for (const slot of PAYLOAD.slots) {
        try {
          rawMasterKey = await tryUnwrap(slot, rawPass);
          break;
        } catch (e) {}
      }

      if (!rawMasterKey) {
        err.style.display = 'block';
        return;
      }

      try {
        const masterKey = await crypto.subtle.importKey('raw', rawMasterKey, { name: 'AES-GCM' }, false, ['decrypt']);
        const decrypted = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: b64ToBuf(PAYLOAD.iv) },
          masterKey,
          b64ToBuf(PAYLOAD.data)
        );
        document.getElementById('gate').style.display = 'none';
        const vault = document.getElementById('vault');
        vault.innerHTML = new TextDecoder().decode(decrypted);
        vault.style.display = 'block';
      } catch (e) {
        err.style.display = 'block';
      }
    }
  </script>
