  <style>

    html { font-family: 'Inter', system-ui, -apple-system, sans-serif; scroll-behavior: smooth; }
    .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    
    /* Estilos para impresión de la tarjeta Navi */
    @media print {
      body * { visibility: hidden; }
      #tarjeta-navi-imprimible, #tarjeta-navi-imprimible * { visibility: visible; }
      #tarjeta-navi-imprimible { 
        position: absolute; 
        left: 0; 
        top: 0; 
        width: 100%; 
        padding: 20px; 
        box-shadow: none !important;
        border: 2px solid #18181b !important;

<body class="bg-[#fcfcfc] text-zinc-900 antialiased selection:bg-black selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==========================================
    // COMPONENTE: NaviFlyer (Generador SVG Dinámico)
    // ==========================================
    function NaviFlyer() {
      const [day, setDay] = useState(21);
      const [month, setMonth] = useState(11);
      const [year, setYear] = useState(1995);

      const handlePrint = () => {
        window.print();
      };

      // Cálculo procedimental basado en la fecha (Día x Mes x Año)
      const visualParams = useMemo(() => {
        const seed = (day || 1) * (month || 1) * (year || 2026);
        return {
          hue: seed % 360, // Tono de color (0-360)
          rotation: seed % 90, // Rotación del SVG (0-90 grados)
        };
      }, [day, month, year]);

      const stickers = [
        { icon: "👂", label: "Escucha" },
        { icon: "◐", label: "Verifica" },
        { icon: "🤝", label: "Ayuda" },
        { icon: "💡", label: "Luz ON" }
      ];

      return (
        <div className="mt-12 max-w-2xl mx-auto w-full">
          
          {/* Controles de Personalización (No se imprimen) */}
          <div className="mb-6 bg-white p-4 rounded-2xl border border-zinc-200 shadow-sm no-print">
            <h4 className="font-bold text-sm text-zinc-800 mb-3">Generador de Certificado Único</h4>
            <div className="grid grid-cols-3 gap-4">
              <div>
                <label className="block text-xs font-medium text-zinc-500 mb-1">Día</label>
                <input type="number" min="1" max="31" value={day} onChange={e => setDay(Number(e.target.value))} className="w-full bg-zinc-50 border border-zinc-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-black" />
              </div>
              <div>
                <label className="block text-xs font-medium text-zinc-500 mb-1">Mes</label>
                <input type="number" min="1" max="12" value={month} onChange={e => setMonth(Number(e.target.value))} className="w-full bg-zinc-50 border border-zinc-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-black" />
              </div>
              <div>
                <label className="block text-xs font-medium text-zinc-500 mb-1">Año</label>
                <input type="number" min="1900" max="2100" value={year} onChange={e => setYear(Number(e.target.value))} className="w-full bg-zinc-50 border border-zinc-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-black" />
              </div>
            </div>
            <div className="mt-3 text-xs text-zinc-400 font-mono">
              Algoritmo Visual: {day} × {month} × {year} = {day * month * year}
            </div>

                transform: `scale(1.5) rotate(${visualParams.rotation}deg)`,
                transition: 'all 0.5s ease-in-out'

                    <circle cx="0" cy="0" r="20" fill="none" stroke={`hsl(${visualParams.hue}, 80%, 40%)`} strokeWidth="1.5" />

                  <div>

                  </div>
                </div>

                <div className="flex items-start gap-4 p-4 rounded-2xl bg-zinc-50/90 backdrop-blur-sm border border-zinc-100">

                </div>
              </div>
            </div>
          </div>

          <div className="flex flex-col sm:flex-row justify-center items-center gap-4 mt-6 no-print">
            <button onClick={handlePrint} className="bg-zinc-900 hover:bg-zinc-800 text-white font-semibold py-2.5 px-6 rounded-full text-sm transition-colors shadow-md flex items-center gap-2 w-full sm:w-auto justify-center">

              <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
              Escribir a StevenDior 5443
            </a>
          </div>
        </div>
      );
    }
