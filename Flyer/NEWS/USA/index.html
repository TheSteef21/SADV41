/* Capa externa opcional — solo se activa con .with-external-watermark */

.with-external-watermark .sadv41-watermark-external-layer {
  opacity: 0.06 !important;
  background-image: url('https://thesteef21.github.io/SADV41/M/I/A/img/');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* Fallback visible sin red: gradiente sutil 6% */

.sadv41-watermark-fallback {
  background: linear-gradient(145deg, #0B0F19 0%, #070A12 100%);
  opacity: 0.06;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #070A12;
    --bg-card: #0B0F19;
  }
}

.hover\:-translate-y-1:hover {
  --tw-translate-y: -0.25rem;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:flex-row {
    flex-direction: row;
  }

  .md\:items-end {
    align-items: flex-end;
  }

  .md\:items-center {
    align-items: center;
  }

  .md\:justify-between {
    justify-content: space-between;
  }

  .md\:p-12 {
    padding: 3rem;
  }

  .md\:text-left {
    text-align: left;
  }

  .md\:text-6xl {
    font-size: 3.75rem;
    line-height: 1;
  }

  .md\:text-\[14px\] {
    font-size: 14px;
  }

  .md\:text-\[15px\] {
    font-size: 15px;
  }

  .md\:text-\[17px\] {
    font-size: 17px;
  }

  .md\:text-sm {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
}

@media (min-width: 1024px) {
  .lg\:col-span-1 {
    grid-column: span 1 / span 1;
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
