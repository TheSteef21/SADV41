    .badge {

      right: 15px;
      background: var(--gold);
      color: #000;
      font-size: 10px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 12px;
      font-family: monospace;
    }
    .gallery-preview {
      display: flex;
      gap: 5px;
      justify-content: center;
      margin-top: 25px;
      opacity: 0.5;
    }
    .gallery-preview span {
