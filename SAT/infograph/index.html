        :root {
            --bg-sacro: #080A0F;
            --dorado-luz: #D4AF37;
            --azul-celestial: #2E5BFF;
            --texto-pergamino: #F5F3EF;
            --borde-hairline: rgba(212, 175, 55, 0.2);
            --bg-card: #11131a;
        }
        .serif { font-family: 'Cormorant Garamond', serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .portal-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }
        .node-navigator {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            padding: 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--borde-hairline);
            border-radius: 8px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        .node-btn {
            background: rgba(8, 10, 15, 0.8);
            color: var(--dorado-luz);
            border: 1px solid var(--borde-hairline);
            padding: 10px 18px;
            font-size: 14px;
            letter-spacing: 0.8px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.4s ease;
            line-height: 1.2;
            font-family: 'JetBrains Mono', monospace;
        }
        .node-btn:hover, .node-btn.active {
            background: var(--dorado-luz);
            color: #000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }
        .transfiguration-chamber {
            position: relative;
            min-height: 600px;
            border: 1px solid var(--borde-hairline);
            border-radius: 4px;
            padding: 32px 28px;
            background: radial-gradient(circle at 50% 0%, rgba(46, 91, 255, 0.08), transparent 70%);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .content-layer {
            display: none;
            opacity: 0;
            transform: scale(0.98);
            transition: all 0.4s ease;
        }
        .content-layer.active {
            display: block;
            opacity: 1;
            transform: scale(1);
        }
        .infograph-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
            margin-top: 22px;
        }
        .infograph-card {
            border: 1px solid var(--borde-hairline);
            border-radius: 6px;
            overflow: hidden;
            background: var(--bg-card);
            text-align: center;
        }
        .infograph-card img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s ease;
        }
        .infograph-card img:hover {
            transform: scale(1.02);
        }
        .img-fallback {
            display: none;
            width: 100%;
            height: 420px;
            background: #12151c;
            color: var(--dorado-luz);
            border: 1px dashed var(--borde-hairline);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-size: 14px;
            letter-spacing: 0.5px;
            padding: 20px;
            text-align: center;
        }
        .infograph-caption {
            padding: 14px 12px;
            font-size: 13px;
            color: rgba(245, 243, 239, 0.75);
            letter-spacing: 0.4px;
            line-height: 1.5;
            background: rgba(0,0,0,0.4);
            font-family: 'JetBrains Mono', monospace;
        }
        .caption-ia {
            display: block;
            margin-top: 6px;
            font-size: 11px;
            color: var(--dorado-luz);
            opacity: 0.85;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
        }
        .arco-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 16px;
            margin: 24px 0;
            align-items: start;
        }
        .arco-col {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--borde-hairline);
            border-radius: 6px;
            padding: 16px;
        }
        .arco-col h4 {
            color: var(--dorado-luz);
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            margin-bottom: 10px;
            line-height: 1.2;
        }
        .arco-col p {
            font-size: 13px;
            color: rgba(245,243,239,0.85);
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.6;
        }
        .arco-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dorado-luz);
            font-size: 20px;
            padding-top: 40px;
        }
        footer {
            margin-top: 50px;
            padding: 30px 0;
            border-top: 1px solid var(--borde-hairline);
            text-align: center;
            font-size: 13px;
            color: rgba(245, 243, 239, 0.7);
            line-height: 1.6;
            font-family: 'JetBrains Mono', monospace;
        }
        .scripture-footer {
            margin-top: 12px;
            color: var(--dorado-luz);
            letter-spacing: 1.5px;
            font-weight: bold;
            font-size: 13px;
        }
        @media (max-width: 768px) {
            .transfiguration-chamber { padding: 20px 16px; }
            .arco-grid { grid-template-columns: 1fr; }
            .arco-arrow { transform: rotate(90deg); padding: 8px 0; }
