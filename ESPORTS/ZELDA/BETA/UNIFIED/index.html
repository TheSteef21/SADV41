una convergencia temporal: Guru-Guru es víctima de un flujo causal que solo existe porque Ikana ya fue purificada. La canción, por tanto, nace en la muerte, viaja por el purgatorio y detona el molino."},{icon:"\uD83D\uDDFA️",title:"Geografía de Spaceworld 1997",color:"#ffd700",body:"En la beta de Spaceworld 1997, el Bosque Perdido no era un laberinto infantil: era un corredor de transición psíquica que conectaba directamente con el Monte Hebra y con el Kakariko original — un Kakariko ampliado, oscuro, prototipo del pueblo Sheikah. Salir por el portal equivocado te arrojaba a una “realidad mental”, una carga de mapa que el N64 DD no pudo sostener. Termina, en esta lectura, no es otro mundo, es un purgatorio: la psique fragmentada de Link después de 7 años de trauma. El overdump F-Zero X de 32MB y el z64proto sw97 confirman que esa geografía existía: un Hyrule beta sin cortes, donde Hebra, Kakariko y Bosque eran continuos. El 64DD murió, la geografía se partió, y quedó M.I.A."},{icon:"\uD83D\uDC41️",title:"Lore Oscuro y Maldiciones Sheikah",color:"#ff3366",body:"El Fondo del Pozo y el Templo de las Sombras nunca fueron mazmorras: eran prisiones de tortura Sheikah. Guillotinas, calabozos con sangre (censurada en la versión 3DS), lenguas cortadas, ojos arrancados. El Ojo Sheikah llora — la lágrima es la traición tras la Guerra Civil Hyliana, cuando los Sheikah fueron usados como verdugos del reino. Bongo Bongo es esa culpa encarnada: el hombre sin cabeza, con un ojo de la verdad en la mano, manos amputadas como castigo al ladrón, cuello sellado. Impa, última Sheikah pura, no cierra el pozo por miedo: lo sella porque sabe que la sombra que escapó es el registro de lo que su clan hizo."},{icon:"\uD83C\uDFB6",title:"Nana de Zelda como Ritual Purificación",color:"#8a7aff",body:"En la beta, los Medallones no eran simples esferas: eran En_Magic_Dark / Light / Soul — objetos equipables con ritual. Mido, en un archivo descartado, era el sabio de las sombras beta, no un niño celoso. La Nana de Zelda (Zelda's Lullaby) funcionaba como llave exorcista: cada vez que la tocabas frente al símbolo de la familia real, purificabas una cámara corrompida. Por eso, al vencer a Morpha, el agua se libera; al vencer al jefe, suena la Nana como cierre. No es música de fondo, es el ritual de sellado. El barco de los muertos en Ikana es psicopompa — como el barquero de la Estigia — y solo cruza si Zelda ha cantado antes. Sin la Nana, no hay purificación, solo posesión."},{icon:"\uD83D\uDC80",title:"Avaricia y Almas Perdidas - Templo Espíritu",color:"#00ff66",body:"Los Stalfos del Templo del Espíritu no son esqueletos genéricos: son las almas de aquellos que se perdieron por avaricia en el desierto. Gerudo entrena con Guanteletes de Plata y Escudo Espejo no para fuerza, sino para reflejar su propia codicia. El Templo prueba a Nabooru y a Link contra el mismo pecado que condenó a esas almas. La analogía con el Rey Nabucodonosor es intencional en los textos descartados: el que se cree dios, termina comiendo polvo, errando como bestia, convertido en Stalfos. Link no mata Stalfos: los libera. Cada vez que cae uno, una sombra se eleva — el alma que por fin deja de vagar porque alguien sin avaricia levantó el espejo."},{icon:"\uD83D\uDDFC",title:"Termina y Torre de Babel - Pecado Ikana",color:"#ff8c00",body:"La Torre de Piedra es una blasfemia arquitectónica: construida con la Trifuerza pisoteada, con estatuas que tienen el símbolo sagrado bajo sus pies. Es la Torre de Babel de Ikana: “llegaremos al cielo insultando a las diosas”. El pecado original de Ikana no fue la guerra, fue la soberbia. Invierten la Torre con la Flecha de Luz — el Emblema Rojo — y literalmente invierten cielo e infierno. Lo sagrado pasa abajo, lo profano arriba. Twinmold no es un gusano, es el guardián del desierto invertido, el castigo por profanar. Solo al quemar la torre, al dejarla caer, Termina deja de ser castigo y se vuelve tumba."},{icon:"\uD83D\uDC79",title:"Majora y Fiera Deidad",color:"#e11d48",body:"Majora no es una máscara: es un dragón primigenio, una armadura de deseos. La tribu antigua — la que desapareció — no talló una máscara, talló un contenedor para un dios que devoraba súplicas. Kishin 鬼神: dios demoníaco, ni bueno ni malo, sino exceso. La Fiera Deidad es su espejo: la máscara que te convierte en aquello que puede matar a Majora porque es igual de terrible. La placa lunar con el triángulo — Trifuerza fragmentada — indica que la luna misma es un altar sacrificial. La batalla final no ocurre “en la luna”: ocurre dentro de Majora, en su interior psíquico, en un prado infantil que es la última mentira antes del apocalipsis. Termina se salva no porque Link sea héroe, sino porque acepta ser monstruo."}],Em=[{label:"SADV41 Inicio",url:"https://thesteef21.github.io/SADV41/",desc:"Raíz del proyecto"},{label:"El Pacto",url:"https://thesteef21.github.io/SADV41/Pacto.html",desc:"Fundamento del Nuevo Pacto"},{label:"GSADV41",url:"https://thesteef21.github.io/Lapizasuli/GSADV41.html",desc:"Portal Operativo"},{label:"Arsenal.html",url:"https://thesteef21.github.io/SADV41/Arsenal.html",desc:"Arsenal completo SADV41"}],Cm=[{label:"Desarrollo Comunitario",url:"https://thesteef21.github.io/SADV41/DesarrolloComunitario.html",desc:"Visión integral para Burunga"},{label:"Juventud",url:"https://thesteef21.github.io/SADV41/DesarrolloComunitario/Juventud.html",desc:"Programa para jóvenes"},{label:"Juventud • Sección Pacto",url:"https://thesteef21.github.io/SADV41/DesarrolloComunitario/Juventud.html#pacto",desc:"Anclaje directo al pacto juvenil"}],_m=[{label:"El Artista",url:"https://thesteef21.github.io/SADV41/Artist.html",desc:"Steven Dior • Perfil"},{label:"Qué Belleza Cuando Vivo Así",url:"https://thesteef21.github.io/Lapizasuli/StevenDiorOficial/2026/QU%C3%89%20BELLEZA%20CUANDO%20VIVO%20AS%C3%8D/index.html",desc:"Álbum Musical 2026",dark:!0},{label:"Tienda Oficial",url:"https://stevendior-shop.fourthwall.com",desc:"Fourthwall Shop"},{label:"NFT / Web3"
