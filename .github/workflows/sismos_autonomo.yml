name: SADV41 TSEC & Instagram Auto-Publisher

on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta automáticamente cada hora
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  run-tsec-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install instagrapi requests pillow

      - name: Restaurar Sesión de Instagram desde Secrets
        env:
          IG_SESSION_DATA: ${{ secrets.IG_SESSION_JSON }}
        run: |
          if [ -n "$IG_SESSION_DATA" ]; then
            echo "$IG_SESSION_DATA" > ig_session.json
            echo "✅ Sesión cargada desde GitHub Secrets."
          fi

      - name: Ejecutar TSEC y Publicar Sismos Pendientes
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        run: |
          python3 post_72h_sismos.py

      - name: Persistir Historial de Sismos Publicados
        run: |
          git config --global user.name "SADV41 AutoBot"
          git config --global user.email "sadv41@gmail.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: actualizar registros de sismos procesados por TSEC" && git push)
