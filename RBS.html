        <section class="bg-slate-900/50 border border-slate-800 rounded-xl p-4 overflow-hidden shadow-xl">

                  <g transform="translate(700, 250)">

    <!-- Logic Core -->
    <script>
        const WEBHOOK_URL = "https://hook.us2.make.com/zjb9v8wrh7iy9fyh4a7m4d2jv4bniwus";

        async function ejecutarVerificacion() {
            const urlInput = document.getElementById("urlInput").value.trim();
            const consoleBox = document.getElementById("statusConsole");
            const logContent = document.getElementById("logContent");
            const card = document.getElementById("verifierCard");
            const btn = document.getElementById("btnValidar");

            if (!urlInput) {
                alert("Por favor ingrese un enlace válido.");
                return;
            }

            // Reset States
            consoleBox.classList.remove("hidden");
            logContent.innerHTML = `<span class="text-blue-400">[INFO] Iniciando escaneo para: ${urlInput}...</span><br>`;
            card.className = "bg-slate-900/80 backdrop-blur border rounded-xl p-6 shadow-2xl transition-all duration-300 glow-border-blue";
            btn.disabled = true;
            btn.innerHTML = `<span>Escaneando...</span>`;

            // Step 1: Pre-validation Format Check
            try {
                const parsedUrl = new URL(urlInput);
                if (parsedUrl.hostname.length < 4 || !parsedUrl.hostname.includes('.')) {
                    throw new Error("Dominio con longitud insuficiente o formato inválido.");
                }
            } catch (e) {
                logContent.innerHTML += `<span class="text-red-500">🔴 [REBOTADO] Error de formato local: ${e.message}</span><br>`;
                card.className = "bg-slate-900/80 backdrop-blur border rounded-xl p-6 shadow-2xl transition-all duration-300 glow-border-red";
                btn.disabled = false;
                btn.innerHTML = `<span>Validar Enlace</span>`;
                return;
            }

            // Step 2: Querying Make + Brave Search Pipeline
            logContent.innerHTML += `<span class="text-yellow-400">[NODO I: ATRIO] Enviando señal a Make Webhook...</span><br>`;
            
            try {
                const response = await fetch(`${WEBHOOK_URL}?url=${encodeURIComponent(urlInput)}`);
                logContent.innerHTML += `<span class="text-yellow-400">[NODO II: SANTO] Procesando respuesta del radar Brave Search...</span><br>`;

                if (!response.ok) {
                    throw new Error("El radar remoto no devolvió estado 200 OK.");
                }

                const data = await response.json();

                // Step 3: Evaluate Results
                if (data.web && data.web.results && data.web.results.length > 0) {
                    logContent.innerHTML += `<span class="text-emerald-400 font-bold">[NODO III: SANTÍSIMO] 🟢 VERIFICADO. Dominio indexado con ${data.web.results.length} resultados.</span><br>`;
                    card.className = "bg-slate-900/80 backdrop-blur border rounded-xl p-6 shadow-2xl transition-all duration-300 glow-border-green";
                } else {
                    logContent.innerHTML += `<span class="text-red-500 font-bold">[NODO III: SANTÍSIMO] 🔴 REBOTADO AL POZO. El enlace no existe o carece de presencia en la red.</span><br>`;
                    card.className = "bg-slate-900/80 backdrop-blur border rounded-xl p-6 shadow-2xl transition-all duration-300 glow-border-red";
                }

            } catch (error) {
                logContent.innerHTML += `<span class="text-red-500">[ERROR] Fallo en la comunicación con la mesa: ${error.message}</span><br>`;
                card.className = "bg-slate-900/80 backdrop-blur border rounded-xl p-6 shadow-2xl transition-all duration-300 glow-border-red";
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Validar Enlace</span>`;
            }
        }
    </script>
</body>
