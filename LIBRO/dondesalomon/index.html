function diagnosticarSufijo(raw) {
  const v = raw.trim().toUpperCase();
  if (!v) return "Escribe un nombre para diagnosticar su sufijo (-AL/-EL, -IH/-AH, -IM, -ON).";
  if (v.endsWith("AL") || v.endsWith("EL")) return `${v} → -AL / -EL: Orden angélica masculina individual (oficio único y línea de mando).`;
  if (v.endsWith("IH") || v.endsWith("IAH") || v.endsWith("AH")) return `${v} → -IH / -AH: Esencia angélica receptiva / matriz que sostiene espacio.`;
  if (v.endsWith("IM")) return `${v} → -IM: Legión colectiva (plural hebreo; coro con función, nunca individuo).`;
  if (v.endsWith("ON")) return `${v} → -ON: Entidad titánica de libre albedrío (eje singular soberano, nunca coro).`;
  return `${v} → Sin sufijo clasificado (-AL/-EL, -IH/-AH, -IM, -ON): revisa la terminación antes de ubicar en el Árbol.`;
}

                    <div style={{color:"var(--cyan)",fontSize:"0.78rem",textTransform:"uppercase"}}>Pilar {seleccion.pilar} · Modo {modoArbol.toUpperCase()}</div>
                    <h3 style={{color:"var(--gold-bright)",margin:"0.3rem 0"}}>{seleccion.id}. {seleccion.name} ({seleccion.es})</h3>
                    <p><strong>Función Sefirótica:</strong> {seleccion.desc}</p>
                    <p style={{marginTop:"0.5rem",color:"#f0a8a8"}}><strong>Correspondencia Qlifótica:</strong> {seleccion.qlifot}</p>
                  </>
                )}
              </div>
            </div>
          </section>
        )}

        {mostrar("cap3") && (
          <section className="card">
            <h2>III. Filología de Raíces &amp; Clasificador Ejecutable</h2>
            <div className="controls">
              <input value={nombreInput} onChange={e => setNombreInput(e.target.value)}
                placeholder="Escribe Mikael, Seraphim, Metatron, Shekinah, Vehuiah..." />
            </div>
            <div className="inspector" style={{marginBottom:"1rem"}}>
              <strong>Diagnóstico:</strong> {diagnosticarSufijo(nombreInput)}
            </div>
            <div className="table-wrap">
              <table>
                <thead><tr><th>Raíz</th><th>Polaridad</th><th>Ejemplos</th><th>Síntesis</th></tr></thead>
                <tbody>
                  <tr><td><strong>-AL / -EL</strong></td><td>Activa, oficio único</td><td>Mika-AL, Gavri-AL, Rafa-AL</td><td>Un portador, un oficio, línea de mando.</td></tr>
                  <tr><td><strong>-IH / -AH</strong></td><td>Receptiva, matriz</td><td>Shekin-AH, Bin-AH, Vehu-IAH</td><td>Presencia que habita y sostiene espacio.</td></tr>
                  <tr><td><strong>-IM</strong></td><td>Legión colectiva</td><td>Seraph-IM, Cherub-IM, EloH-IM</td><td>Plural hebreo; coro con función, no individuo.</td></tr>
                  <tr><td><strong>-ON</strong></td><td>Singular soberana</td><td>Metatr-ON, Sandalph-ON, Ai-ON</td><td>Entidad titánica de libre albedrío; no es coro.</td></tr>
                </tbody>
              </table>
            </div>
          </section>
        )}

        {mostrar("cap4") && (
          <section className="card" id="matriz72">
            <h2>IV. Matriz 72 (3 + 1) · Ángeles y Tensión Goética</h2>
            <div className="controls">
              <input value={filtro72} onChange={e => setFiltro72(e.target.value)}
                placeholder="Buscar por #, Ángel, atributo o contraparte..." />
              <select value={sufijo72} onChange={e => setSufijo72(e.target.value)}>
                <option value="ALL">Todos (72)</option>
                <option value="Yah">Sufijo -Yah</option>
                <option value="El">Sufijo -El</option>
              </select>
            </div>
            <div className="table-wrap">
              <table>
                <thead><tr><th>#</th><th>Ángel (3+1)</th><th>Sufijo</th><th>Atributo</th><th>Contraparte</th></tr></thead>
                <tbody>
                  {filasFiltradas.map((r,idx) => (
                    <tr key={idx}>
                      <td><strong>{idx+1}</strong></td>
                      <td><strong>{r[0]}</strong></td>
                      <td>-{r[1]}</td>
                      <td>{r[2]}</td>
                      <td>{r[3]} ({r[4]})</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>
        )}
      </main>

      <footer>DON DE SALOMÓN · Libro ReactX JS · SADV41 · thesteef21.github.io/SADV41/LIBRO/dondesalomon/</footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
