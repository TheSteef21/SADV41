        body { background-color: var(--obsidiana); color:#f8fafc; font-family: Inter, system-ui, -apple-system, sans-serif; overflow-x:hidden; overflow-x: clip; position:relative; scroll-behavior:smooth; transition: background 0.8s ease, color 0.8s ease; max-width:100vw; }

        @keyframes pageGlitch { 0%{transform:translate(0) skew(0deg);filter:hue-rotate(0deg)} 20%{transform:translate(-10px,6px) skew(-5deg);filter:hue-rotate(180deg) contrast(200%) invert(0.1)} 40%{transform:translate(10px,-6px) skew(5deg);filter:hue-rotate(-90deg) invert(0.2)} 60%{transform:translate(-4px,4px) skew(-3deg);filter:hue-rotate(90deg) drop-shadow(0 0 20px var(--cyan))} 80%{transform:translate(4px,-4px) skew(3deg);filter:hue-rotate(-45deg)} 100%{transform:translate(0) skew(0deg);filter:hue-rotate(0deg)} }
        .glitch-active { animation: pageGlitch 0.7s cubic-bezier(.25,.46,.45,.94) both; }
        .layer-glitch { mix-blend-mode: color-dodge !important; transform: scale(1.05) rotate(-1deg) !important; filter: contrast(250%) saturate(400%) hue-rotate(270deg) drop-shadow(0 0 30px var(--violet)) !important; opacity:1 !important; }

        @keyframes rubberBounce { 0%{transform:translate(-50%,-50%) scaleX(1.25) scaleY(0.75)} 15%{transform:translate(-50%,-50%) scaleX(0.85) scaleY(1.25) translateY(-8px)} 30%{transform:translate(-50%,-50%) scaleX(1.1) scaleY(0.9)} 45%{transform:translate(-50%,-50%) scaleX(0.95) scaleY(1.05) translateY(-4px)} 60%{transform:translate(-50%,-50%) scaleX(1.05) scaleY(0.95)} 75%{transform:translate(-50%,-50%) scaleX(0.98) scaleY(1.02)} 100%{transform:translate(-50%,-50%) scaleX(1) scaleY(1)} }

        .sponsor-marquee { width:100%; max-width:100vw; background:#000; border-bottom:1px solid var(--oro); overflow:hidden; white-space:nowrap; padding:6px 0; font-family: JetBrains Mono, monospace; font-size:10px; color:var(--oro); text-transform:uppercase; letter-spacing:0.2em; position:fixed; top:0; z-index:70; }
        .sponsor-marquee span { display:inline-block; padding-left:100%; animation: marquee 30s linear infinite; }
        @keyframes marquee { 0%{transform:translate(0,0)} 100%{transform:translate(-100%,0)} }

        .grand-line-bg { position:fixed; inset:0; z-index:0; background: radial-gradient(circle at 50% 20%, rgba(212,175,55,0.1) 0%, transparent 60%), radial-gradient(circle at 80% 80%, rgba(0,243,255,0.08) 0%, transparent 50%), linear-gradient(to bottom, transparent, rgba(3,3,5,0.9)); pointer-events:none; transition: all 0.8s; }
        .quinta-mode .grand-line-bg { background: radial-gradient(circle at 50% 15%, rgba(212,175,55,0.25) 0%, transparent 60%), radial-gradient(circle at 80% 80%, rgba(255,255,255,0.6) 0%, transparent 50%), linear-gradient(to bottom, #fdfbf0, #fff8e1) !important; }
        .chaos-bg-container { position:fixed; inset:0; z-index:-1; background:#000; pointer-events:none; overflow:hidden; transition: opacity 0.8s; max-width:100vw; }
        .quinta-mode .chaos-bg-container { opacity:0.15 !important; }
        .chaos-layer { position:absolute; inset:0; background-size:cover; background-position:center; opacity:0; mix-blend-mode:screen; filter:contrast(125%) brightness(95%) saturate(1.2); transition: opacity 3.5s, transform 9s, filter 0.3s; will-change: opacity, transform, filter; }
        .chaos-layer.active { opacity:0.55; transform:scale(1.03) rotate(0.3deg); }
        .grid-pattern { background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px); background-size:32px 32px; opacity:0.25; position:fixed; inset:0; z-index:1; pointer-events:none; max-width:100vw; }
        .scanline { width:100%; height:2px; background:linear-gradient(90deg, transparent, rgba(0,243,255,0.4), transparent); position:fixed; z-index:60; top:0; pointer-events:none; animation: scanline 8s linear infinite; }
        @keyframes scanline { 0%{top:0} 100%{top:100%} }

        .glass-strong { background:rgba(3,6,15,0.94); backdrop-filter:blur(22px); border:1px solid rgba(0,243,255,0.3); transition: all 0.6s; max-width:100%; }
        .logia-card { background:linear-gradient(145deg, rgba(10,10,10,0.88), rgba(20,20,20,0.88)); border:1px solid rgba(212,175,55,0.18); box-shadow:0 15px 35px rgba(0,0,0,0.9), inset 0 0 20px rgba(212,175,55,0.05); transition:all 0.5s ease; backdrop-filter:blur(12px); position:relative; overflow:hidden; max-width:100%; }
        .logia-card:hover { border-color:rgba(0,243,255,0.5); box-shadow:0 20px 40px rgba(0,0,0,0.9), inset 0 0 30px rgba(0,243,255,0.1); transform: translateY(-2px); }
        .quinta-mode .logia-card { background:linear-gradient(145deg, #ffffff, #fff9db) !important; border-color:#d4af37 !important; box-shadow:0 15px 35px rgba(212,175,55,0.15), inset 0 0 20px rgba(255,255,255,0.8) !important; color:#1a1a1a; }
        .quinta-mode .glass, .quinta-mode .glass-strong { background:rgba(255,255,255,0.92) !important; border-color:#d4af37 !important; color:#1a1a1a; }

        .quinta-mode .text-slate-300, .quinta-mode .text-slate-400 { color:#4a4a4a !important; }

        .sidebar-tabs { position:fixed; left:0; top:50%; transform:translateY(-50%); z-index:65; display:flex; flex-direction:column; gap:8px; transition:all 0.5s cubic-bezier(0.4,0,0.2,1); max-width:90vw; }
