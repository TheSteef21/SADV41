  <script>
    // 1. Pega aquí tus enlaces de Pinterest para Anime Core cuando los tengas:
    const animePins = [
      // "https://www.pinterest.com/pin/ID_AQUI/",
    ];

    // 2. Categorías del carrusel Anime Core
    const animeTrends = [
      {
        tag: "01 • Dark Fantasy & Shonen",
        title: "Sombras, Trazos & Energía",
        description: "Estética nocturna de alto contraste, secuencias de combate, aura oscura y composición dramática.",
        accent: "from-violet-600/20 via-zinc-900 to-zinc-950",
        badgeColor: "text-violet-300 border-violet-500/30 bg-violet-500/10",
        actionLabel: "Ver tablero Anime Core",
        actionHref: "#animeGridSection"
      },
      {
        tag: "02 • Retro 90s Cel & Lo-Fi",
        title: "Nostalgia Analógica & VHS",
        description: "Fotogramas clásicos de los años 90, iluminación urbana nocturna, grano de película y estética lo-fi.",
        accent: "from-fuchsia-600/20 via-zinc-900 to-zinc-950",
        badgeColor: "text-fuchsia-300 border-fuchsia-500/30 bg-fuchsia-500/10",
        actionLabel: "Ver tablero Anime Core",
        actionHref: "#animeGridSection"
      },
      {
        tag: "03 • Worldbuilding & Aventura",
        title: "Horizontes & Escala Épica",
        description: "Escenarios monumentales, arquitectura fantástica, mares abiertos y diseño de personajes icónicos.",
        accent: "from-cyan-600/20 via-zinc-900 to-zinc-950",
        badgeColor: "text-cyan-300 border-cyan-500/30 bg-cyan-500/10",
        actionLabel: "Ver tablero Anime Core",
        actionHref: "#animeGridSection"
      },
      {
        tag: "04 • Manga Panels & Ink",
        title: "Blanco, Negro & Tinta Pura",
        description: "Viñetas monocromáticas, tramas de sombreado, tipografía japonesa y arte conceptual editorial.",
        accent: "from-rose-600/20 via-zinc-900 to-zinc-950",
        badgeColor: "text-rose-300 border-rose-500/30 bg-rose-500/10",
        actionLabel: "Explorar CORE (34 pines)",
        actionHref: "../CORE/embbed/index.html"
      }
    ];

    const track = document.getElementById("carouselTrack");
    const dotsContainer = document.getElementById("carouselDots");
    const counter = document.getElementById("slideCounter");
    let currentIndex = 0;

    function renderSlides() {
      track.innerHTML = animeTrends.map((item) => `
        <article class="w-full shrink-0 p-6 sm:p-10 md:p-14 bg-gradient-to-br ${item.accent} flex flex-col justify-between min-h-[330px] sm:min-h-[370px]">
          <div class="max-w-2xl">
            <span class="inline-block text-xs font-medium px-3 py-1 rounded-full border ${item.badgeColor} mb-4">
              ${item.tag}
            </span>
            <h2 class="text-2xl sm:text-4xl font-bold text-white tracking-tight mb-3">
              ${item.title}
            </h2>
            <p class="text-sm sm:text-base text-zinc-400 leading-relaxed">
              ${item.description}
            </p>
          </div>

          <div class="mt-8">
            <a href="${item.actionHref}" class="inline-block px-5 py-2.5 rounded-xl bg-zinc-100 hover:bg-white text-zinc-950 font-semibold text-sm transition">
              ${item.actionLabel}
            </a>
          </div>
        </article>
      `).join("");

      dotsContainer.innerHTML = animeTrends.map((_, i) => `
        <button
          aria-label="Ir a diapositiva ${i + 1}"
          onclick="goToSlide(${i})"
          class="h-1.5 rounded-full transition-all ${i === currentIndex ? "w-8 bg-violet-400" : "w-2 bg-zinc-700 hover:bg-zinc-500"}">
        </button>
      `).join("");
    }

    function updateCarousel() {
      track.style.transform = `translateX(-${currentIndex * 100}%)`;
      counter.textContent = `${String(currentIndex + 1).padStart(2, "0")} / ${String(animeTrends.length).padStart(2, "0")}`;

      Array.from(dotsContainer.children).forEach((dot, i) => {
        dot.className = `h-1.5 rounded-full transition-all ${
          i === currentIndex ? "w-8 bg-violet-400" : "w-2 bg-zinc-700 hover:bg-zinc-500"
        }`;
      });
    }

    function goToSlide(index) {
      currentIndex = (index + animeTrends.length) % animeTrends.length;
      updateCarousel();
    }

    function renderPins() {
      const container = document.getElementById("animePinsContainer");
      const badge = document.getElementById("pinCountBadge");
      badge.textContent = `${animePins.length} ${animePins.length === 1 ? "pin" : "pines"}`;

      if (animePins.length === 0) {
        container.className = "rounded-xl border border-dashed border-zinc-800 p-8 text-center text-sm text-zinc-500";
        container.innerHTML = `Agrega tus enlaces en el arreglo <code class="text-violet-400">animePins</code> dentro de <code class="text-zinc-300">anime-core/index.html</code> para desplegar los pines aquí.`;
        return;
      }

      container.innerHTML = animePins.map((url) => `
        <div class="pin-card">
          <a data-pin-do="embedPin" data-pin-width="medium" href="${url}"></a>
        </div>
      `).join("");
    }

    document.getElementById("prevBtn").addEventListener("click", () => goToSlide(currentIndex - 1));
    document.getElementById("nextBtn").addEventListener("click", () => goToSlide(currentIndex + 1));

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") goToSlide(currentIndex - 1);
      if (e.key === "ArrowRight") goToSlide(currentIndex + 1);
    });

    let touchStartX = 0;
    const viewport = document.getElementById("carouselViewport");
    viewport.addEventListener("touchstart", (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    viewport.addEventListener("touchend", (e) => {
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 45) goToSlide(diff > 0 ? currentIndex + 1 : currentIndex - 1);
    }, { passive: true });

    renderSlides();
    updateCarousel();
    renderPins();
  </script>

<script>
(function() {
  function makeElementDraggable(elmnt) {
    if (!elmnt || elmnt.dataset.sadv41Draggable === "true") return;
    elmnt.dataset.sadv41Draggable = "true";

    // Asegurar propiedades de posicionamiento sin romper el diseño
    const style = window.getComputedStyle(elmnt);
    if (style.position !== 'fixed' && style.position !== 'absolute') {
      elmnt.style.position = 'fixed';
    }
    elmnt.style.touchAction = 'none';
    elmnt.style.userSelect = 'none';

    let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
    let isDragging = false;

    elmnt.onmousedown = dragMouseDown;
    elmnt.addEventListener('touchstart', dragTouchStart, { passive: false });

    function dragMouseDown(e) {
      e = e || window.event;
      if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON') return;
      e.preventDefault();
      pos3 = e.clientX;
      pos4 = e.clientY;
      document.onmouseup = closeDragElement;
      document.onmousemove = elementDrag;
    }

    function elementDrag(e) {
      e = e || window.event;
      e.preventDefault();
      isDragging = true;
      pos1 = pos3 - e.clientX;
      pos2 = pos4 - e.clientY;
      pos3 = e.clientX;
      pos4 = e.clientY;
      
      elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
      elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
      elmnt.style.bottom = 'auto';
      elmnt.style.right = 'auto';
    }

    function closeDragElement() {
      document.onmouseup = null;
      document.onmousemove = null;
      setTimeout(() => { isDragging = false; }, 50);
    }

    function dragTouchStart(e) {
      if (e.touches.length === 1) {
        if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON') return;
        let touch = e.touches[0];
        pos3 = touch.clientX;
        pos4 = touch.clientY;
        document.addEventListener('touchend', closeTouchDrag, { passive: false });
        document.addEventListener('touchmove', elementTouchDrag, { passive: false });
      }
    }

    function elementTouchDrag(e) {
      if (e.touches.length === 1) {
        let touch = e.touches[0];
        isDragging = true;
        pos1 = pos3 - touch.clientX;
        pos2 = pos4 - touch.clientY;
        pos3 = touch.clientX;
        pos4 = touch.clientY;

        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        elmnt.style.bottom = 'auto';
        elmnt.style.right = 'auto';
        e.preventDefault();
      }
    }

    function closeTouchDrag() {
      document.removeEventListener('touchend', closeTouchDrag);
      document.removeEventListener('touchmove', elementTouchDrag);
      setTimeout(() => { isDragging = false; }, 50);
    }

    elmnt.addEventListener('click', function(e) {
      if (isDragging) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);
  }

  function initUniversalDraggable() {
    // 1. Contenedores flotantes SADV41
    const sadvContainer = document.getElementById('sadv41-floating-container');
    const menu = document.getElementById('sadv41-menu');
    if (sadvContainer) {
      makeElementDraggable(sadvContainer);
      sadvContainer.addEventListener('mouseenter', () => { if (menu) menu.style.display = 'block'; });
      sadvContainer.addEventListener('mouseleave', () => { if (menu) menu.style.display = 'none'; });
    }

    // 2. Selección explícita de todos los botones e íconos flotantes
    // Incluye: Menú lateral, Barra inferior (STEVENDIOR.AI, AGENT HUB, BINANCE ID) y Logo SAT GOB
    const selectors = [
      '[class*="-floating"]', '[id*="-floating"]', '[class*="floating-"]',
      '[class*="dock"]', '[id*="dock"]', '[class*="nav-bottom"]',
      'img[src*="sat"]', 'img[src*="SAT"]', 'a[href*="BINANCE"]',
      '.fixed', '#sat-gob-logo', '#agent-hub-bar'
    ];

    document.querySelectorAll(selectors.join(',')).forEach(el => {
      // Aplicar al contenedor del elemento flotante si existe
      const target = el.closest('div') || el;
      makeElementDraggable(target);
    });

    // 3. Fallback: Buscar cualquier elemento en el DOM con position: fixed que no sea un header/footer rígido
    document.querySelectorAll('body *').forEach(el => {
      const style = window.getComputedStyle(el);
      if (style.position === 'fixed' && style.zIndex > 10) {
        makeElementDraggable(el);
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initUniversalDraggable);
  } else {
    initUniversalDraggable();
  }
})();
</script>
