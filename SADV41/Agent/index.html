<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Hub | SADV41</title>
    <meta name="theme-color" content="#030305">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { navy: '#020617', oro: '#facc15', 
                        emerald: { 400: '#34d399', 500: '#10b981' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #030305; color: #f8fafc; font-family: 'Courier New', Courier, monospace; }
        .glass-panel { background: rgba(10, 15, 25, 0.5); border: 1px dashed rgba(16, 185, 129, 0.4); border-radius: 1rem; backdrop-filter: blur(10px); }
        .scanline { width: 100%; height: 2px; background: rgba(16, 185, 129, 0.1); position: fixed; top: 0; animation: scan 6s linear infinite; pointer-events: none; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">
    <div class="scanline"></div>
    
    <div class="glass-panel max-w-2xl w-full p-10 text-center space-y-6 z-10 shadow-2xl shadow-emerald-500/10">
        <div class="text-4xl animate-pulse text-emerald-400">🛸</div>
        <h1 class="text-2xl font-bold text-emerald-400 tracking-widest uppercase">Agent Hub <span class="text-white">|</span> SADV41</h1>
        <p class="text-slate-400 text-sm">Sector asignado y preparado. Espacio vacante esperando nuevos módulos, scripts y directrices de la misión.</p>
        
        <div class="mt-8 p-6 border border-slate-800 rounded-lg bg-navy/50">
            <span class="text-oro text-xs uppercase tracking-widest font-bold">Estado del Servidor:</span>
            <span class="text-slate-300 text-xs ml-2">Standby / Listo para inyección de código</span>
            <div class="mt-4 flex justify-center gap-3">
                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></div>
                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-ping" style="animation-delay: 0.2s"></div>
                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-ping" style="animation-delay: 0.4s"></div>
            </div>
        </div>
    </div>
</body>
</html>
