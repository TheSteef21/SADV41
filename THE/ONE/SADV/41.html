        :root { --oro:#d4af37; --obsidiana:#030305; --cyan:#00f3ff; --violet:#9d4edd; --red:#FB542B; }
        html,body { max-width:100vw; overflow-x:hidden; }
        .sponsor-marquee { width:100vw; max-width:100%; background:#000; border-bottom:1px solid var(--oro); overflow:hidden; white-space:nowrap; padding:7px 0; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--oro); text-transform:uppercase; letter-spacing:0.22em; position:fixed; top:0; left:0; z-index:70; box-sizing:border-box; }

        .grid-pattern { background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px); background-size:32px 32px; opacity:0.22; position:fixed; inset:0; z-index:1; pointer-events:none; max-width:100vw; }
        .scanline { width:100vw; max-width:100%; height:2px; background:linear-gradient(90deg, transparent, rgba(0,243,255,0.45), transparent); position:fixed; z-index:60; top:0; left:0; pointer-events:none; animation: scanline 8s linear infinite; }
        @keyframes scanline { 0%{top:0} 100%{top:100vh} }
        .glass { background:rgba(8,12,28,0.92); backdrop-filter:blur(18px); border:1px solid rgba(212,175,55,0.18); border-radius:14px; }
        .logia-card { background:linear-gradient(145deg, rgba(12,12,18,0.94), rgba(18,18,28,0.9)); border:1px solid rgba(212,175,55,0.16); box-shadow:0 16px 40px rgba(0,0,0,0.9); transition:all 0.45s ease; backdrop-filter:blur(14px); overflow:hidden; }

        .sec-block a { color: #38bdf8; text-decoration: underline; }
        .sidebar-tabs { position:fixed; left:0; top:50%; transform:translateY(-50%); z-index:65; display:flex; flex-direction:column; gap:8px; transition:all 0.5s cubic-bezier(0.4,0,0.2,1); }
        .vertical-tab { display:flex; align-items:center; background:rgba(2,6,23,0.97); padding:10px 14px; border-radius:0 12px 12px 0; transition:all 0.28s; width:54px; overflow:hidden; white-space:nowrap; box-shadow:4px 4px 18px rgba(0,0,0,0.7); cursor:pointer; text-decoration:none; color:#fff; border-left:3px solid var(--cyan); font-family:'JetBrains Mono',monospace; font-size:11px; }
        .vertical-tab:hover { width:360px; padding-left:18px; background:rgba(212,175,55,0.14); }
        .vertical-tab span.icon { font-size:1.3rem; min-width:28px; display:flex; justify-content:center; }
        .vertical-tab span.text { margin-left:12px; font-weight:700; opacity:0; transition:opacity 0.25s; font-size:0.78rem; }
        .vertical-tab:hover span.text { opacity:1; transition-delay:0.08s; }
        .sidebar-tabs.right-aligned { left:auto; right:0; }
        .sidebar-tabs.right-aligned .vertical-tab { border-radius:12px 0 0 12px; border-left:none; border-right:3px solid var(--cyan); flex-direction:row-reverse; }
        .sidebar-tabs.right-aligned .vertical-tab span.text { margin-left:0; margin-right:12px; }
        #flower-container { perspective:1400px; width:100%; max-width:100%; height:450px; display:flex; justify-content:center; align-items:center; position:relative; overflow:hidden; box-sizing:border-box; }
        #flower-scene { width:420px; height:420px; max-width:90vw; max-height:90vw; transform-style:preserve-3d; position:relative; cursor:grab; }
        #flower-scene:active { cursor:grabbing; }
        .flower-plane { position:absolute; top:0; left:0; width:100%; height:100%; transform-style:preserve-3d; opacity:.24; pointer-events:none; }
        .node-3d { position:absolute; left:50%; top:50%; transform-style:preserve-3d; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .node-dot { width:13px; height:13px; border-radius:50%; border:2px solid rgba(255,255,255,.9); box-shadow:0 0 12px currentColor; transition:all .22s ease; }
        .node-label { margin-top:6px; font-size:8px; font-weight:700; background:rgba(0,0,0,.78); border:1px solid rgba(255,255,255,.14); padding:2px 5px; border-radius:4px; font-family:'JetBrains Mono',monospace; letter-spacing:0.05em; }
        .font-mason { font-family:'Cinzel', serif; }
        .font-pirate { font-family:'Pirata One', cursive; }
        .font-mono { font-family:'JetBrains Mono', monospace; }
        main { max-width:100vw; overflow-x:hidden; box-sizing:border-box; }
        @media (max-width: 768px) {
          .sidebar-tabs { top:auto; bottom:0; left:0; right:0; transform:none; flex-direction:row; overflow-x:auto; padding:8px; justify-content:flex-start; background:rgba(2,6,23,0.98); border-top:1px solid rgba(212,175,55,0.28); max-width:100vw; box-sizing:border-box; }

          .vertical-tab span.text { opacity:1; margin-left:8px; font-size:10px; }
